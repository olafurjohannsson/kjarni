[package]
name = "kjarni-cli"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Kjarni from the shell: classification, embeddings, reranking, search, chat, summarization, translation and speech-to-text as commands, and an MCP server for AI agents. Same output as PyTorch."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kjarni"
path = "src/main.rs"

[dependencies]
kjarni = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
env_logger = "0.11"
colored = "2"
bincode = "1"
walkdir = "2.5.0"
tempfile = "3.23.0"
axum = { version = "0.8.9", features = ["multipart"] }
# Line diffs of the files a daemon conversation changed.
similar = "2.7"
tower-http = { version = "0.7.1", features = ["cors"] }
serde = { workspace = true, features = ["derive"] }
base64 = "0.23.1"
async-trait = { workspace = true }
dirs = { workspace = true }
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `kjarni mcp` points stdout at stderr, keeping the real stdout for protocol
# messages only.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The daemon's log redirection and the machine's memory size.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation"] }

[lints]
workspace = true

[features]
default = ["image-io"]

# On by default here, unlike the library: someone running the CLI wants
# `kjarni image index ~/Photos` to work without rebuilding with a flag.
image-io = ["kjarni/image-io"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
