[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kjarni"
version = "0.8.2"
description = "Run transformer models inside your Python program: embeddings, classification, reranking, search, chat, speech-to-text, summarization and translation. Same output as PyTorch, no PyTorch needed."
authors = [{name = "Ólafur Aron Jóhannsson"}]
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"
# No hard dependencies. numpy is imported on demand by encode_batch, which
# falls back to a list of lists when it is absent.
dependencies = []
readme = "README.md"
keywords = [
    "embeddings", "sentence-transformers", "reranking", "cross-encoder",
    "semantic-search", "rag", "classification", "llm", "speech-to-text",
    "whisper", "transformers", "inference", "local", "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
numpy = ["numpy>=1.20"]

[project.urls]
Homepage = "https://kjarni.ai"
Documentation = "https://kjarni.ai"
Repository = "https://github.com/kjarni-ai/kjarni"
Issues = "https://github.com/kjarni-ai/kjarni/issues"
Changelog = "https://github.com/kjarni-ai/kjarni/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
kjarni = ["*.so", "*.dylib", "*.dll", "lib/*"]