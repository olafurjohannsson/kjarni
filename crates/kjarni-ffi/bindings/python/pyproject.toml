[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kjarni"
version = "0.4.0"
description = "Run transformer models inside your Python program: embeddings, classification, reranking, search, chat, speech-to-text, summarization and translation. Same output as PyTorch, no PyTorch needed."
authors = [{name = "Ólafur Aron Jóhannsson"}]
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"
# No hard dependencies. numpy is imported on demand by encode_batch, which
# falls back to a list of lists when it is absent.
dependencies = []
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
numpy = ["numpy>=1.20"]

[project.urls]
Homepage = "https://kjarni.ai"
Documentation = "https://kjarni.ai"
Repository = "https://github.com/olafurjohannsson/kjarni"
Issues = "https://github.com/olafurjohannsson/kjarni/issues"
Changelog = "https://github.com/olafurjohannsson/kjarni/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
kjarni = ["*.so", "*.dylib", "*.dll", "lib/*"]