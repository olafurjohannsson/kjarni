[package]
name = "kjarni-ffi"
version.workspace = true
edition = "2024"
description = "C FFI bindings for Kjarni"

# crates.io ships the Rust source. The C# and Go bindings, their prebuilt native
# libraries and the dist tree travel through NuGet, the kjarni-go repo and GitHub
# releases instead; including them here is 96MB against a 10MiB limit.
exclude = ["bindings/", "dist/", "examples/"]
homepage.workspace = true
documentation.workspace = true
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
c-bindings = []

[dependencies]
kjarni = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde_json = "1.0"
num_cpus = "1.16"
futures = "0.3.31"
rayon = "1.10"
[build-dependencies]
cbindgen = "0.29.2"

[package.metadata.cargo-rpath]
lib-path = "$ORIGIN"

[lints]
workspace = true
