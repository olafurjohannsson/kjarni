name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.91.1"

jobs:
  # ─── Lint ───────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets 2>&1 || true

  # ─── Test (CPU only, models cached) ────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/kjarni
          key: kjarni-models-v2

      - name: Build CLI for model downloads
        run: cargo build --release --package kjarni-cli

      - name: Download test models
        run: |
          CLI=./target/release/kjarni
          $CLI model download distilbert-sentiment
          $CLI model download roberta-sentiment
          $CLI model download bert-sentiment-multilingual
          $CLI model download roberta-emotions
          $CLI model download toxic-bert
          $CLI model download distilroberta-emotion
          $CLI model download minilm-l6-v2
          $CLI model download gpt2
          $CLI model download minilm-l6-v2-cross-encoder
          $CLI model download distilbert-base
          $CLI model download flan-t5-base
          $CLI model download distilbart-cnn

      - name: Run tests
        run: cargo test --workspace --exclude kjarni-wasm

  # ─── C# binding tests (the shipped NuGet surface) ───────────────
  csharp-test:
    name: Test (C# binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: csharp-test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/kjarni
          key: kjarni-models-csharp-v1

      - name: Build native FFI library
        run: cargo build --release --package kjarni-ffi

      - name: Build CLI for model downloads
        run: cargo build --release --package kjarni-cli

      - name: Download models used by the C# tests
        run: |
          CLI=./target/release/kjarni
          $CLI model download minilm-l6-v2
          $CLI model download minilm-l6-v2-cross-encoder
          $CLI model download mpnet-base-v2
          $CLI model download distilbert-base
          $CLI model download distilbert-sentiment
          $CLI model download roberta-sentiment
          $CLI model download bert-sentiment-multilingual
          $CLI model download distilroberta-emotion
          $CLI model download toxic-bert

      # Runs both Kjarni.Tests and Kjarni.Extensions.AI.Tests via the solution.
      # GPU tests self-skip via SkippableFact when no adapter is present,
      # so the whole suite runs on a CPU-only runner.
      - name: Run C# tests
        run: >
          dotnet test
          crates/kjarni-ffi/bindings/csharp/Kjarni.sln
          --configuration Release
          --logger "console;verbosity=normal"

  # ─── WASM check (kjarni-transformers engine) ────────────────────
  wasm-check:
    name: WASM check (kjarni-transformers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check

      - name: Check kjarni-transformers for wasm32
        run: cargo check -p kjarni-transformers --target wasm32-unknown-unknown --no-default-features

  # ─── Linux x86_64 ──────────────────────────────────────────────
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build CLI
        run: cargo zigbuild --release --package kjarni-cli --target x86_64-unknown-linux-gnu.2.17

      - name: Build FFI
        run: cargo zigbuild --release --package kjarni-ffi --target x86_64-unknown-linux-gnu.2.17

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/kjarni dist/
          cp target/x86_64-unknown-linux-gnu/release/libkjarni_ffi.so dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-x86_64-linux
          path: dist/

  # ─── Linux aarch64 ─────────────────────────────────────────────
  build-linux-arm:
    name: Build (Linux aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-aarch64

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build CLI
        run: cargo zigbuild --release --package kjarni-cli --target aarch64-unknown-linux-gnu.2.17

      - name: Build FFI
        run: cargo zigbuild --release --package kjarni-ffi --target aarch64-unknown-linux-gnu.2.17

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/kjarni dist/
          cp target/aarch64-unknown-linux-gnu/release/libkjarni_ffi.so dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-aarch64-linux
          path: dist/

  # ─── macOS aarch64 ─────────────────────────────────────────────
  build-macos:
    name: Build (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64

      - name: Build CLI
        run: cargo build --release --package kjarni-cli --target aarch64-apple-darwin

      - name: Build FFI
        run: cargo build --release --package kjarni-ffi --target aarch64-apple-darwin

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/kjarni dist/
          cp target/aarch64-apple-darwin/release/libkjarni_ffi.dylib dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-aarch64-macos
          path: dist/

  # ─── Windows x86_64 ─────────────────────────────────────────────
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build CLI
        run: cargo build --release --package kjarni-cli --target x86_64-pc-windows-msvc

      - name: Build FFI
        run: cargo build --release --package kjarni-ffi --target x86_64-pc-windows-msvc

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/kjarni.exe dist/
          cp target/x86_64-pc-windows-msvc/release/kjarni_ffi.dll dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-x86_64-windows
          path: dist/

  # ─── WASM ──────────────────────────────────────────────────────
  build-wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd crates/kjarni-wasm
          RUSTFLAGS='-C target-feature=+simd128' \
            wasm-pack build --release --target web -- --no-default-features --locked

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-wasm
          path: crates/kjarni-wasm/pkg/

  # ─── Release ────────────────────────────────────────────────────
  release:
    name: Release
    needs:
      [
        test,
        csharp-test,
        build-linux,
        build-linux-arm,
        build-macos,
        build-windows,
        build-wasm,
      ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package archives
        run: |
          cd artifacts
          tar -czf kjarni-x86_64-linux.tar.gz \
            -C kjarni-x86_64-linux .
          tar -czf kjarni-aarch64-linux.tar.gz \
            -C kjarni-aarch64-linux .
          tar -czf kjarni-aarch64-macos.tar.gz \
            -C kjarni-aarch64-macos .
          # Windows ships as .zip — sync-nuget.yml and sync-go.yml both unzip
          # this asset. Producing a .tar.gz here silently breaks both syncs.
          (cd kjarni-x86_64-windows && zip -qr ../kjarni-x86_64-windows.zip .)
          tar -czf kjarni-wasm.tar.gz \
            -C kjarni-wasm .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A tag with a hyphen is a SemVer prerelease (v0.1.3-preview.1).
          # Without this it would be published as "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/kjarni-x86_64-linux.tar.gz
            artifacts/kjarni-aarch64-linux.tar.gz
            artifacts/kjarni-aarch64-macos.tar.gz
            artifacts/kjarni-x86_64-windows.zip
            artifacts/kjarni-wasm.tar.gz

  # ─── Publish to NuGet ───────────────────────────────────────────
  # This lives here, not in a release-triggered workflow, because GitHub does
  # not trigger workflows from events raised by GITHUB_TOKEN. The release above
  # is authored by github-actions[bot], so `on: release: [published]` never
  # fires — which is why v0.1.1 and v0.1.2 never reached NuGet. Depending on
  # `release` via `needs` keeps it in-run, where no event delivery is involved.
  #
  # sync-nuget.yml still exists as a manual (workflow_dispatch) re-publish path.
  publish-nuget:
    name: Publish to NuGet
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The same artifacts the release job published, taken directly from the
      # run rather than re-downloaded from the release.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Place native libraries
        run: |
          CSHARP_DIR=crates/kjarni-ffi/bindings/csharp/Kjarni
          # Tracked as a symlink to ../runtimes; replace it with real directories.
          rm -rf "$CSHARP_DIR/runtimes"
          mkdir -p "$CSHARP_DIR"/runtimes/{linux-x64,linux-arm64,osx-arm64,win-x64}/native

          cp artifacts/kjarni-x86_64-linux/libkjarni_ffi.so    "$CSHARP_DIR/runtimes/linux-x64/native/"
          cp artifacts/kjarni-aarch64-linux/libkjarni_ffi.so   "$CSHARP_DIR/runtimes/linux-arm64/native/"
          cp artifacts/kjarni-aarch64-macos/libkjarni_ffi.dylib "$CSHARP_DIR/runtimes/osx-arm64/native/"
          cp artifacts/kjarni-x86_64-windows/kjarni_ffi.dll    "$CSHARP_DIR/runtimes/win-x64/native/"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version $VERSION"

      - name: Pack
        run: |
          cd crates/kjarni-ffi/bindings/csharp/Kjarni
          dotnet pack -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o nupkg
          cd ../Kjarni.Extensions.AI
          dotnet pack -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o nupkg

      # Fails the job before publishing if a native library is missing from the
      # package, which is otherwise only discoverable by a user at runtime.
      - name: Verify package contents
        run: |
          PKG=$(ls crates/kjarni-ffi/bindings/csharp/Kjarni/nupkg/*.nupkg)
          unzip -l "$PKG"
          for rid in linux-x64 linux-arm64 osx-arm64 win-x64; do
            unzip -l "$PKG" | grep -q "runtimes/$rid/native/" \
              || { echo "::error::missing native library for $rid"; exit 1; }
          done
          echo "All four native libraries present."

      # Kjarni is pushed first: Kjarni.Extensions.AI depends on it, and NuGet
      # rejects a package whose dependency is not yet indexed.
      - name: Push to NuGet
        run: |
          cd crates/kjarni-ffi/bindings/csharp/Kjarni/nupkg
          dotnet nuget push *.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          cd "$GITHUB_WORKSPACE/crates/kjarni-ffi/bindings/csharp/Kjarni.Extensions.AI/nupkg"
          dotnet nuget push *.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
