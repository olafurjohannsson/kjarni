name: CI

# TEMPORARY: stripped down to just the Windows build job while getting
# it working. Restore the rest of the jobs from main before merging.

on:
  push:
    branches: [main, windows-ci]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.91.1"

jobs:
  # ─── Windows x86_64 ─────────────────────────────────────────────
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build CLI
        run: cargo build --release --package kjarni-cli --target x86_64-pc-windows-msvc

      - name: Build FFI
        run: cargo build --release --package kjarni-ffi --target x86_64-pc-windows-msvc

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/kjarni.exe dist/
          cp target/x86_64-pc-windows-msvc/release/kjarni_ffi.dll dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-x86_64-windows
          path: dist/
