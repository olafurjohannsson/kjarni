name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.91.1"

jobs:
  # ─── Lint ───────────────────────────────────────────────────────
  #
  # This job ended in `|| true` for as long as it existed, so it reported green on
  # a workspace that clippy could not even compile: eight deny-by-default findings,
  # including a `pub fn` in the C ABI that dereferenced a caller's raw pointer
  # without being `unsafe`, and three `assert!(x.len() >= 0)` that are true for
  # every possible input. A lint job that cannot fail is a lint job that is not run.
  #
  # `-D warnings` is what makes it real. Deliberate exemptions live in
  # `[workspace.lints.clippy]` in the root Cargo.toml, each with the reason it is
  # exempt, so an allow is a decision in the diff rather than an invisible default.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ─── Format ─────────────────────────────────────────────────────
  #
  # Stock rustfmt defaults; there is no rustfmt.toml. This keeps a diff about one
  # change from also carrying whatever a contributor's format-on-save did to the
  # rest of the file.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: rustfmt
      - run: cargo fmt --all --check

  # ─── Test (CPU only, models cached) ────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2

      # One key per job, deliberately. These three jobs download different model
      # sets (13 here, 9 for csharp-test, 3 for cpp-test) and run concurrently.
      # `actions/cache` keys are immutable and a job only saves when it missed, so
      # a single shared key is won permanently by whichever job saves first --
      # usually cpp-test, which downloads the least. Every later run would then
      # restore a three-model cache and this job would re-download the other ten
      # each time, unable to save because the key already exists. The overlap
      # costs roughly 1GB against a 10GB per-repository limit; the race does not.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/kjarni
          key: kjarni-models-test-v3

      # Built under the same profile as the tests below so the two share
      # artifacts instead of compiling the dependency graph twice.
      - name: Build CLI for model downloads
        run: cargo build --profile ci --package kjarni-cli

      - name: Download test models
        run: |
          CLI=./target/ci/kjarni
          $CLI model download distilbert-sentiment
          $CLI model download roberta-sentiment
          $CLI model download bert-sentiment-multilingual
          $CLI model download roberta-emotions
          $CLI model download toxic-bert
          $CLI model download distilroberta-emotion
          $CLI model download minilm-l6-v2
          $CLI model download gpt2
          $CLI model download minilm-l6-v2-cross-encoder
          $CLI model download distilbert-base
          $CLI model download flan-t5-base
          $CLI model download distilbart-cnn
          $CLI model download qwen2.5-0.5b-instruct

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quantizer dependencies
        run: pip install -r crates/kjarni-wasm/scripts/requirements.txt

      # Both the kjarni-models and kjarni-wasm .kjq suites look for fixtures in a
      # sibling website checkout that CI does not have. All of them skipped and
      # passed green while testing nothing. Export the fixtures here from the
      # weights already cached above; KJARNI_KJQ_DIR makes a missing one fail loudly.
      - name: Export .kjq fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/kjq
          Q="python3 crates/kjarni-wasm/scripts/quantize_model.py"
          C="$HOME/.cache/kjarni"
          $Q --model-dir "$C/sentence-transformers_all-MiniLM-L6-v2"                   --output /tmp/kjq/all-MiniLM-L6-v2-q8.kjq
          $Q --model-dir "$C/cross-encoder_ms-marco-MiniLM-L-6-v2"                     --output /tmp/kjq/ms-marco-MiniLM-L-6-v2-q8.kjq
          $Q --model-dir "$C/distilbert_distilbert-base-uncased-finetuned-sst-2-english" --output /tmp/kjq/distilbert-sentiment-q8.kjq
          $Q --model-dir "$C/Qwen_Qwen2.5-0.5B-Instruct"                               --output /tmp/kjq/qwen05b-q8.kjq
          ls -la /tmp/kjq

      # Run from the scripts directory: `discover -s <nested/path>` fails with
      # "Start directory is not importable" unless the tree is a package.
      - name: Test the quantizer itself
        working-directory: crates/kjarni-wasm/scripts
        run: python3 -m unittest discover -p "test_*.py" -v

      # `cargo test` with no profile flag uses `test`, which inherits `dev` at
      # opt-level 0; the decode loop is roughly twenty times slower unoptimised and
      # that is what made this job take an hour. `--profile ci` is release
      # optimisation with `debug_assert!`s and overflow checks still on, so this
      # checks everything the dev-profile run checked. Plain `--release` would
      # silence all 51 `debug_assert!`s and the 20 `#[cfg(debug_assertions)]`
      # blocks -- the GPU buffer-aliasing check, the FFN dimension check, the
      # encoder capacity check -- and would pay fat LTO for no benefit here.
      # See [profile.ci] in the root Cargo.toml.
      - name: Run tests (optimised)
        env:
          KJARNI_KJQ_DIR: /tmp/kjq
        run: cargo test --workspace --profile ci

  # ─── C# binding tests (the shipped NuGet surface) ───────────────
  csharp-test:
    name: Test (C# binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: csharp-test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/kjarni
          key: kjarni-models-csharp-v3

      - name: Build native FFI library
        run: cargo build --release --package kjarni-ffi

      # --release, matching the FFI build above: these jobs link the shipped
      # release artifact, so building the CLI under another profile would compile
      # the dependency graph a second time and leave the binary in target/ci
      # while the step below looks in target/release.
      - name: Build CLI for model downloads
        run: cargo build --release --package kjarni-cli

      - name: Download models used by the C# tests
        run: |
          CLI=./target/release/kjarni
          $CLI model download minilm-l6-v2
          $CLI model download minilm-l6-v2-cross-encoder
          $CLI model download mpnet-base-v2
          $CLI model download distilbert-base
          $CLI model download distilbert-sentiment
          $CLI model download roberta-sentiment
          $CLI model download bert-sentiment-multilingual
          $CLI model download distilroberta-emotion
          $CLI model download toxic-bert

      # Runs both Kjarni.Tests and Kjarni.Extensions.AI.Tests via the solution.
      # GPU tests self-skip via SkippableFact when no adapter is present,
      # so the whole suite runs on a CPU-only runner.
      - name: Run C# tests
        run: >
          dotnet test
          crates/kjarni-ffi/bindings/csharp/Kjarni.sln
          --configuration Release
          --logger "console;verbosity=normal"

  # ─── C++ binding tests (the shipped C ABI and header) ───────────
  #
  # Until this job existed, nothing built C++ at all: kjarni.h shipped in every
  # release archive without ever being compiled, and kjarni.hpp had no coverage.
  # The header had in fact been broken for months without anyone noticing.
  #
  # The sync check below is the important one. A stale header is the failure mode
  # that actually bites consumers, and it is silent: the library exports a symbol
  # the header does not declare, or declares one that no longer exists.
  cpp-test:
    name: Test (C++ binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-test

      # ubuntu-latest defaults to GCC 13, which has std::expected but not <print>.
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/kjarni
          key: kjarni-models-cpp-v3

      - name: Build native FFI library
        run: cargo build --release --package kjarni-ffi

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      # Regenerate and diff rather than just compiling. Compiling proves the header
      # is valid; only the diff proves it still matches the library beside it.
      - name: Verify kjarni.h is in sync with the FFI source
        working-directory: crates/kjarni-ffi
        run: |
          cbindgen --config cbindgen.toml --crate kjarni-ffi --output /tmp/kjarni.regen.h
          if ! diff -u include/kjarni.h /tmp/kjarni.regen.h; then
            echo "::error::kjarni.h is stale. Regenerate it:"
            echo "  cd crates/kjarni-ffi && cbindgen --config cbindgen.toml --crate kjarni-ffi --output include/kjarni.h"
            exit 1
          fi
          diff -u include/kjarni.h dist/include/kjarni.h || {
            echo "::error::dist/include/kjarni.h differs from include/kjarni.h"; exit 1; }

      # The C ABI has to stay usable from C, not only from C++.
      - name: Compile kjarni.h as C
        run: |
          echo '#include "kjarni.h"' > /tmp/abi.c
          echo 'int main(void) { return kjarni_version() == 0; }' >> /tmp/abi.c
          gcc-14 -std=c11 -Wall -Wextra -Werror \
            -Icrates/kjarni-ffi/include /tmp/abi.c \
            -Ltarget/release -lkjarni_ffi -o /tmp/abi

      # --release, matching the FFI build above: these jobs link the shipped
      # release artifact, so building the CLI under another profile would compile
      # the dependency graph a second time and leave the binary in target/ci
      # while the step below looks in target/release.
      - name: Build CLI for model downloads
        run: cargo build --release --package kjarni-cli

      - name: Download models used by the C++ tests
        run: |
          CLI=./target/release/kjarni
          $CLI model download minilm-l6-v2
          $CLI model download minilm-l6-v2-cross-encoder
          $CLI model download distilbert-sentiment

      - name: Build C++ tests
        working-directory: crates/kjarni-ffi/tests/cpp
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKJARNI_SANITIZE=ON \
            -DKJARNI_LIB_DIR=${{ github.workspace }}/target/release
          cmake --build build

      - name: Run C++ tests
        working-directory: crates/kjarni-ffi/tests/cpp
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

      # Compiled but not run: the chat section needs llama3.2-1b-instruct, and a
      # 2.5GB download on every CI run is not worth what it proves here. The test
      # suite above already exercises the wrapper against real models.
      - name: Compile the C++ example
        working-directory: crates/kjarni-ffi/examples/cpp
        env:
          CXX: g++-14
        run: |
          cmake -B build -DKJARNI_LIB_DIR=${{ github.workspace }}/target/release
          cmake --build build

  # ─── WASM check (kjarni-transformers engine) ────────────────────
  wasm-check:
    name: WASM check (kjarni-transformers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check

      - name: Check kjarni-transformers for wasm32
        run: cargo check -p kjarni-transformers --target wasm32-unknown-unknown --no-default-features

  # ─── Browser test (the actual WASM artifact) ────────────────────
  #
  # Everything else testing kjarni-wasm runs the Rust natively, which covers the
  # engine and misses the artifact entirely: a broken import, a bundle built from
  # stale sources, a binding that only throws through wasm-bindgen's glue. All of
  # those ship green otherwise, which is how the live demo served a bundle with no
  # classification or chat in it while CI stayed green.
  wasm-browser-test:
    name: Test (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-browser-test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/kjarni
          key: kjarni-models-browser-v3

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # The same flags the release build uses, so this exercises the artifact
      # people actually download rather than a debug approximation of it.
      - name: Build WASM
        run: |
          cd crates/kjarni-wasm
          RUSTFLAGS='-C target-feature=+simd128' \
            wasm-pack build --release --target web -- --no-default-features --locked

      - name: Build CLI and fetch the encoder weights
        run: |
          cargo build --release --package kjarni-cli
          ./target/release/kjarni model download minilm-l6-v2

      # Served locally rather than fetched from Hugging Face: the point of this
      # job is the bundle, and a network hiccup should not turn into a red build.
      - name: Export the .kjq fixture
        run: |
          pip install -r crates/kjarni-wasm/scripts/requirements.txt
          mkdir -p /tmp/kjq
          python3 crates/kjarni-wasm/scripts/quantize_model.py \
            --model-dir ~/.cache/kjarni/sentence-transformers_all-MiniLM-L6-v2 \
            --output /tmp/kjq/all-MiniLM-L6-v2-q8.kjq

      - name: Install the browser
        working-directory: crates/kjarni-wasm/tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run
        working-directory: crates/kjarni-wasm/tests/browser
        env:
          KJARNI_KJQ_DIR: /tmp/kjq
        run: node run.mjs

  # ─── Linux x86_64 ──────────────────────────────────────────────
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build CLI
        run: cargo zigbuild --release --package kjarni-cli --target x86_64-unknown-linux-gnu.2.17

      - name: Build FFI
        run: cargo zigbuild --release --package kjarni-ffi --target x86_64-unknown-linux-gnu.2.17

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/kjarni dist/
          cp target/x86_64-unknown-linux-gnu/release/libkjarni_ffi.so dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/
          cp crates/kjarni-ffi/include/kjarni.hpp dist/

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-x86_64-linux
          path: dist/

  # ─── Linux aarch64 ─────────────────────────────────────────────
  build-linux-arm:
    name: Build (Linux aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-aarch64

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build CLI
        run: cargo zigbuild --release --package kjarni-cli --target aarch64-unknown-linux-gnu.2.17

      - name: Build FFI
        run: cargo zigbuild --release --package kjarni-ffi --target aarch64-unknown-linux-gnu.2.17

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/kjarni dist/
          cp target/aarch64-unknown-linux-gnu/release/libkjarni_ffi.so dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/
          cp crates/kjarni-ffi/include/kjarni.hpp dist/

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-aarch64-linux
          path: dist/

  # ─── macOS aarch64 ─────────────────────────────────────────────
  build-macos:
    name: Build (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64

      - name: Build CLI
        run: cargo build --release --package kjarni-cli --target aarch64-apple-darwin

      - name: Build FFI
        run: cargo build --release --package kjarni-ffi --target aarch64-apple-darwin

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/kjarni dist/
          cp target/aarch64-apple-darwin/release/libkjarni_ffi.dylib dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/
          cp crates/kjarni-ffi/include/kjarni.hpp dist/

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-aarch64-macos
          path: dist/

  # ─── Windows x86_64 ─────────────────────────────────────────────
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build CLI
        run: cargo build --release --package kjarni-cli --target x86_64-pc-windows-msvc

      - name: Build FFI
        run: cargo build --release --package kjarni-ffi --target x86_64-pc-windows-msvc

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/kjarni.exe dist/
          cp target/x86_64-pc-windows-msvc/release/kjarni_ffi.dll dist/
          cp crates/kjarni-ffi/include/kjarni.h dist/
          cp crates/kjarni-ffi/include/kjarni.hpp dist/

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-x86_64-windows
          path: dist/

  # ─── WASM ──────────────────────────────────────────────────────
  build-wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd crates/kjarni-wasm
          RUSTFLAGS='-C target-feature=+simd128' \
            wasm-pack build --release --target web -- --no-default-features --locked

      - uses: actions/upload-artifact@v4
        with:
          name: kjarni-wasm
          path: crates/kjarni-wasm/pkg/

  # ─── Release ────────────────────────────────────────────────────
  release:
    name: Release
    needs:
      [
        test,
        csharp-test,
        # cpp-test gates the C ABI header against the library shipping beside it.
        # Without it here, a stale or uncompilable kjarni.h reaches every release
        # archive, which is the exact failure that job was added to catch.
        cpp-test,
        wasm-browser-test,
        build-linux,
        build-linux-arm,
        build-macos,
        build-windows,
        build-wasm,
      ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package archives
        run: |
          cd artifacts
          tar -czf kjarni-x86_64-linux.tar.gz \
            -C kjarni-x86_64-linux .
          tar -czf kjarni-aarch64-linux.tar.gz \
            -C kjarni-aarch64-linux .
          tar -czf kjarni-aarch64-macos.tar.gz \
            -C kjarni-aarch64-macos .
          # Windows ships as .zip — sync-nuget.yml and sync-go.yml both unzip
          # this asset. Producing a .tar.gz here silently breaks both syncs.
          (cd kjarni-x86_64-windows && zip -qr ../kjarni-x86_64-windows.zip .)
          tar -czf kjarni-wasm.tar.gz \
            -C kjarni-wasm .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A tag with a hyphen is a SemVer prerelease (v0.1.3-preview.1).
          # Without this it would be published as "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/kjarni-x86_64-linux.tar.gz
            artifacts/kjarni-aarch64-linux.tar.gz
            artifacts/kjarni-aarch64-macos.tar.gz
            artifacts/kjarni-x86_64-windows.zip
            artifacts/kjarni-wasm.tar.gz

  # ─── Publish to npm ─────────────────────────────────────────────
  #
  # Needs an NPM_TOKEN secret: an npm automation token with publish rights on
  # `kjarni-wasm`. Create it at npmjs.com under Access Tokens, then add it in
  # Settings > Secrets and variables > Actions. Without it this job fails at the
  # publish step rather than silently skipping.
  publish-npm:
    name: Publish to npm
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The published package is the TypeScript wrapper plus the wasm-pack output
      # it wraps, so both have to be present before packing.
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: kjarni-wasm
          path: crates/kjarni-wasm/pkg/

      # `npm run build` runs prebuild first, which copies ../pkg into the package.
      # The bundle has to live inside the package directory: npm silently drops
      # any `files` entry outside it, so publishing without this ships a package
      # whose every import fails at runtime.
      - name: Build the TypeScript wrapper
        working-directory: crates/kjarni-wasm/ts
        run: |
          npm install --no-audit --no-fund
          npm run build
          # Two ways this has already gone wrong: `files` pointing outside the
          # package root (npm drops it silently), and wasm-pack's own .gitignore
          # containing `*` (npm honours it when there is no .npmignore). Both
          # produce a green publish of a package that cannot work, so check the
          # tarball rather than the working directory.
          npm pack --dry-run 2>&1 | grep -q 'pkg/kjarni_wasm_bg.wasm' || {
            echo "::error::the wasm bundle is not in the npm tarball"; exit 1; }

      # npm versions are immutable like NuGet's, so the version has to come from
      # the tag rather than whatever is committed in package.json.
      - name: Publish
        working-directory: crates/kjarni-wasm/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --access public

  # ─── Publish to NuGet ───────────────────────────────────────────
  # This lives here, not in a release-triggered workflow, because GitHub does
  # not trigger workflows from events raised by GITHUB_TOKEN. The release above
  # is authored by github-actions[bot], so `on: release: [published]` never
  # fires — which is why v0.1.1 and v0.1.2 never reached NuGet. Depending on
  # `release` via `needs` keeps it in-run, where no event delivery is involved.
  #
  # sync-nuget.yml still exists as a manual (workflow_dispatch) re-publish path.
  publish-nuget:
    name: Publish to NuGet
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The same artifacts the release job published, taken directly from the
      # run rather than re-downloaded from the release.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Place native libraries
        run: |
          CSHARP_DIR=crates/kjarni-ffi/bindings/csharp/Kjarni
          # Tracked as a symlink to ../runtimes; replace it with real directories.
          rm -rf "$CSHARP_DIR/runtimes"
          mkdir -p "$CSHARP_DIR"/runtimes/{linux-x64,linux-arm64,osx-arm64,win-x64}/native

          cp artifacts/kjarni-x86_64-linux/libkjarni_ffi.so    "$CSHARP_DIR/runtimes/linux-x64/native/"
          cp artifacts/kjarni-aarch64-linux/libkjarni_ffi.so   "$CSHARP_DIR/runtimes/linux-arm64/native/"
          cp artifacts/kjarni-aarch64-macos/libkjarni_ffi.dylib "$CSHARP_DIR/runtimes/osx-arm64/native/"
          cp artifacts/kjarni-x86_64-windows/kjarni_ffi.dll    "$CSHARP_DIR/runtimes/win-x64/native/"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version $VERSION"

      - name: Pack
        run: |
          cd crates/kjarni-ffi/bindings/csharp/Kjarni
          dotnet pack -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o nupkg
          cd ../Kjarni.Extensions.AI
          dotnet pack -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o nupkg

      # Fails the job before publishing if a native library is missing from the
      # package, which is otherwise only discoverable by a user at runtime.
      - name: Verify package contents
        run: |
          PKG=$(ls crates/kjarni-ffi/bindings/csharp/Kjarni/nupkg/*.nupkg)
          unzip -l "$PKG"
          for rid in linux-x64 linux-arm64 osx-arm64 win-x64; do
            unzip -l "$PKG" | grep -q "runtimes/$rid/native/" \
              || { echo "::error::missing native library for $rid"; exit 1; }
          done
          echo "All four native libraries present."

      # Kjarni is pushed first: Kjarni.Extensions.AI depends on it, and NuGet
      # rejects a package whose dependency is not yet indexed.
      - name: Push to NuGet
        run: |
          cd crates/kjarni-ffi/bindings/csharp/Kjarni/nupkg
          dotnet nuget push *.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          cd "$GITHUB_WORKSPACE/crates/kjarni-ffi/bindings/csharp/Kjarni.Extensions.AI/nupkg"
          dotnet nuget push *.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
