name: Sync Go Bindings

# Manual re-publish only. The real publish runs from ci.yml on a version tag:
# a release created by CI uses GITHUB_TOKEN, and GitHub does not fire
# `on: release` for those, so this workflow never ran on its own. Kept for
# re-pushing the module without cutting a new release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.1.6)"
        required: true

jobs:
  sync-go:
    name: Sync to kjarni-go
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download ${{ inputs.tag }} \
            --dir release-assets

      - name: Prepare Go repo content
        run: |
          # Underscores, and only the two platforms lib.go can load. Its switch
          # handles linux and windows and reads these paths verbatim; the hyphenated
          # four-platform layout this used to write would have failed at runtime.
          mkdir -p go-push/lib/linux_amd64 go-push/lib/windows_amd64

          tar -xzf release-assets/kjarni-x86_64-linux.tar.gz -C go-push/lib/linux_amd64
          unzip -o release-assets/kjarni-x86_64-windows.zip -d go-push/lib/windows_amd64

          # Copy Go source files from monorepo
          cp crates/kjarni-ffi/bindings/go/*.go go-push/
          cp crates/kjarni-ffi/bindings/go/go.mod go-push/
          cp crates/kjarni-ffi/bindings/go/go.sum go-push/ 2>/dev/null || true
          cp crates/kjarni-ffi/include/kjarni.h go-push/

      - name: Push to kjarni-go
        env:
          GO_REPO_TOKEN: ${{ secrets.GO_REPO_PAT }}
        run: |
          DEST=$(mktemp -d)
          git clone https://x-access-token:${GO_REPO_TOKEN}@github.com/olafurjohannsson/kjarni-go.git "$DEST"
          cd "$DEST"

          # Overwrite Go source + binaries, keep README/LICENSE
          cp -r $GITHUB_WORKSPACE/go-push/* .

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from kjarni ${{ inputs.tag }}" || echo "No changes"
          git tag "${{ inputs.tag }}" 2>/dev/null || true
          git push origin main --tags
